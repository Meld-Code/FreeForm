<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101713">
  <title>FreeForm | Account access</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101713;
      color: #eef4ee;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
* {
  box-sizing: border-box;
}

body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
  display: grid;
  place-items: center;
  padding: 24px;
  background:
    radial-gradient(ellipse at 15% 12%, rgba(55, 117, 74, 0.2), transparent 38%),
    radial-gradient(ellipse at 90% 88%, rgba(171, 100, 34, 0.12), transparent 35%),
    #101713;
}

button,
input {
  font: inherit;
}

.page {
  width: min(100%, 440px);
}

.brand {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 11px;
  margin-bottom: 24px;
  color: #f4f8f3;
  font-size: 22px;
  font-weight: 750;
  letter-spacing: 0.02em;
}

.brand-mark {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(173, 222, 177, 0.35);
  border-radius: 11px;
  color: #c3edc4;
  background: linear-gradient(145deg, #244c31, #17251c);
  box-shadow: 0 0 24px rgba(92, 173, 102, 0.13);
  font-size: 19px;
  line-height: 1;
}

.card {
  padding: clamp(25px, 7vw, 38px);
  border: 1px solid rgba(218, 238, 220, 0.11);
  border-radius: 20px;
  background: rgba(24, 33, 27, 0.92);
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
}

.heading {
  margin: 0;
  font-size: clamp(25px, 6vw, 31px);
  font-weight: 700;
  letter-spacing: -0.04em;
}

.subtitle {
  margin: 9px 0 25px;
  color: #a8b5aa;
  font-size: 14px;
  line-height: 1.6;
}

.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
  margin-bottom: 23px;
  padding: 5px;
  border: 1px solid rgba(218, 238, 220, 0.08);
  border-radius: 11px;
  background: #121a15;
}

.tab {
  min-height: 40px;
  border: 0;
  border-radius: 8px;
  color: #9eaca0;
  background: transparent;
  cursor: pointer;
  font-size: 14px;
  font-weight: 650;
  transition: color 150ms ease, background 150ms ease;
}

.tab[aria-selected="true"] {
  color: #eff8ef;
  background: #27382b;
  box-shadow: inset 0 0 0 1px rgba(196, 229, 194, 0.1);
}

.field {
  margin-bottom: 17px;
}

.label-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}

label {
  color: #dce6dc;
  font-size: 13px;
  font-weight: 620;
}

input {
  width: 100%;
  min-height: 47px;
  padding: 0 13px;
  border: 1px solid #344239;
  border-radius: 9px;
  outline: none;
  color: #f2f6f2;
  background: #141c17;
  font-size: 14px;
  transition: border-color 150ms ease, box-shadow 150ms ease;
}

input::placeholder {
  color: #748177;
}

input:focus {
  border-color: #80b884;
  box-shadow: 0 0 0 3px rgba(111, 180, 118, 0.15);
}

.submit {
  width: 100%;
  min-height: 48px;
  margin-top: 5px;
  border: 1px solid #a3d2a4;
  border-radius: 9px;
  color: #102014;
  background: linear-gradient(180deg, #c0e5bd, #a9d5a7);
  cursor: pointer;
  font-size: 14px;
  font-weight: 750;
  transition: filter 150ms ease, transform 150ms ease;
}

.submit:hover {
  filter: brightness(1.06);
}

.submit:active {
  transform: translateY(1px);
}

.message {
  min-height: 20px;
  margin: 13px 0 0;
  color: #b9e2b9;
  font-size: 13px;
  line-height: 1.5;
  text-align: center;
}

.message.error {
  color: #ffb4a9;
}

.footer {
  margin: 19px 0 0;
  color: #87958a;
  font-size: 12px;
  line-height: 1.6;
  text-align: center;
}

[hidden] {
  display: none !important;
}

@media (max-width: 420px) {
  body {
    padding: 16px;
  }

  .brand {
    margin-bottom: 18px;
  }

  .card {
    border-radius: 16px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
  }
}

  </style>
</head>
<body>
  <main class="page">
    <div class="brand" aria-label="FreeForm">
      <span class="brand-mark" aria-hidden="true">F</span>
      <span>FreeForm</span>
    </div>
<section class="card" aria-labelledby="form-title">
  <h1 class="heading" id="form-title">Welcome back</h1>
  <p class="subtitle" id="form-subtitle">Sign in to continue to your account.</p>

  <div class="tabs" role="tablist" aria-label="Account access">
    <button
      class="tab"
      id="signin-tab"
      type="button"
      role="tab"
      aria-selected="true"
      aria-controls="auth-form"
    >Sign in</button>
    <button
      class="tab"
      id="signup-tab"
      type="button"
      role="tab"
      aria-selected="false"
      aria-controls="auth-form"
    >Create account</button>
  </div>

  <form id="auth-form">
    <div class="field">
      <div class="label-row">
        <label for="username">Username</label>
      </div>
      <input
        id="username"
        name="username"
        type="text"
        placeholder="Enter your username"
        autocomplete="username"
        minlength="3"
        maxlength="32"
        required
      >
    </div>

    <div class="field">
      <div class="label-row">
        <label for="password">Password</label>
      </div>
      <input
        id="password"
        name="password"
        type="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        minlength="9"
        maxlength="64"
        required
      >
    </div>

    <div class="field" id="confirm-field" hidden>
      <div class="label-row">
        <label for="confirm-password">Confirm password</label>
      </div>
      <input
        id="confirm-password"
        name="confirm-password"
        type="password"
        placeholder="Enter your password again"
        autocomplete="new-password"
        minlength="9"
        maxlength="64"
      >
    </div>

    <button class="submit" id="submit-button" type="submit">Sign in</button>
    <p class="message" id="form-message" aria-live="polite"></p>
  </form>

  <p class="footer">
    Connect an authentication service to enable account creation and sign-in.
  </p>
</section>

  </main>
  <script>
    const form = document.getElementById('auth-form');
    const signInTab = document.getElementById('signin-tab');
    const signUpTab = document.getElementById('signup-tab');
    const title = document.getElementById('form-title');
    const subtitle = document.getElementById('form-subtitle');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const confirmField = document.getElementById('confirm-field');
    const confirmInput = document.getElementById('confirm-password');
    const submitButton = document.getElementById('submit-button');
    const message = document.getElementById('form-message');

    let mode = 'signin';

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.classList.toggle('error', isError);
    }

    function setMode(nextMode) {
      mode = nextMode;
      const isSignUp = mode === 'signup';

      signInTab.setAttribute('aria-selected', String(!isSignUp));
      signUpTab.setAttribute('aria-selected', String(isSignUp));

      title.textContent = isSignUp ? 'Create your account' : 'Welcome back';
      subtitle.textContent = isSignUp
        ? 'Create an account to get started with FreeForm.'
        : 'Sign in to continue to your account.';

      submitButton.textContent = isSignUp ? 'Create account' : 'Sign in';
      confirmField.hidden = !isSignUp;
      confirmInput.required = isSignUp;
      passwordInput.autocomplete = isSignUp ? 'new-password' : 'current-password';

      showMessage('');
    }

    signInTab.addEventListener('click', () => setMode('signin'));
    signUpTab.addEventListener('click', () => setMode('signup'));

    form.addEventListener('submit', event => {
      event.preventDefault();
      showMessage('');

      if (!form.reportValidity()) return;

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (username.length < 3) {
        showMessage('Username must be at least 3 characters long.', true);
        usernameInput.focus();
        return;
      }

      if (password.length <= 8) {
        showMessage('Password must be more than 8 characters.', true);
        passwordInput.focus();
        return;
      }

      if (mode === 'signup' && password !== confirmInput.value) {
        showMessage('The passwords do not match.', true);
        confirmInput.focus();
        return;
      }

      if (mode === 'signup') {
        showMessage(
          `Account creation for ${username} requires a connected authentication service.`
        );
      } else {
        showMessage(
          `Sign-in for ${username} requires a connected authentication service.`
        );
      }
    });
  </script>
</body>
</html>
